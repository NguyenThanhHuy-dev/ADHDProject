name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adhd
          POSTGRES_PASSWORD: adhd_ci_password
          POSTGRES_DB: adhd_focus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adhd -d adhd_focus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://adhd:adhd_ci_password@localhost:5432/adhd_focus
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:server
      - run: npm test
      - run: npm run test:server
      # Applies the migrations to a real Postgres, the API tests use an in-memory one.
      - run: npx tsx src/db/migrate.ts
        working-directory: server
      - run: npm run build
