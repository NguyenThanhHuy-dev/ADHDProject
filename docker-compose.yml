# Development: `docker compose up -d db` starts only the database.
# Everything in containers: `JWT_SECRET=<32+ chars> docker compose --profile full up --build`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adhd
      POSTGRES_PASSWORD: adhd_dev_password
      POSTGRES_DB: adhd_focus
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adhd -d adhd_focus']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://adhd:adhd_dev_password@db:5432/adhd_focus
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a random string of at least 32 characters}
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY: 'true'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    profiles: [full]
    build: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  pgdata:
